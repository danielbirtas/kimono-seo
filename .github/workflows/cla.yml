name: CLA Assistant

# Requires contributors to sign the CLA (see CLA.md) before their PR can be merged.
# Signatures are recorded in signatures/cla.json in this repo. A contributor signs by
# commenting the exact sentence below on their PR; commenting "recheck" re-runs the check.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set a PERSONAL_ACCESS_TOKEN secret to store signatures in a separate repo.
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/danielbirtas/kimono-seo/blob/main/CLA.md'
          branch: 'main'
          custom-notsigned-prcomment: 'Thank you for your contribution! Before we can merge it, please read our [Contributor License Agreement](https://github.com/danielbirtas/kimono-seo/blob/main/CLA.md) and sign it by posting the comment below.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✅'
          allowlist: danielbirtas,bot*,dependabot[bot]

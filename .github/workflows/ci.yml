name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

  # Lint and typecheck are advisory: the codebase predates these gates and still
  # carries pre-existing style/type findings. This job surfaces them in the logs
  # but never fails the workflow (continue-on-error). Contributors should avoid
  # adding *new* lint/type errors; cleaning up the backlog is welcome.
  quality:
    name: Lint & typecheck (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint (non-blocking)
        run: npm run lint || true

      - name: Typecheck (non-blocking)
        run: npm run typecheck || true
